services:
  redis:
    image: redis:8.10.0
    container_name: s2974-hw9-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hw9_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hw9_redis_data:
