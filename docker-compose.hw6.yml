services:
  mongodb:
    image: mongo:7.0
    container_name: s2974-hw6-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: s2974_doc
    volumes:
      - s2974_hw6_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  s2974_hw6_mongo_data:
    driver: local
