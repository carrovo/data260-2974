<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Homework requires the title to be HW1-{Your Name}. -->
    <title>HW1-Xuanhua Li</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f8;
            color: #263238;
        }

        h1 {
            text-align: center;
        }

        form {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #9e9e9e;
            border-radius: 4px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .terms input {
            width: auto;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #125aa0;
        }
    </style>
</head>

<body>
    <!-- The largest heading identifies the assigned domain. -->
    <h1>Rental Housing Listings</h1>

    <form id="rentalForm">
        <!-- Primary field: required and automatically focused. -->
        <label for="listingTitle">Listing Title</label>
        <input
            type="text"
            id="listingTitle"
            name="listingTitle"
            placeholder="Enter a title for the rental listing"
            required
            autofocus
        >

        <!-- Secondary field. -->
        <label for="address">Property Address</label>
        <input
            type="text"
            id="address"
            name="address"
            placeholder="Enter the rental property address"
            required
        >

        <!-- Submitter email. -->
        <label for="submitterEmail">Submitter Email</label>
        <input
            type="email"
            id="submitterEmail"
            name="submitterEmail"
            placeholder="Enter your email address"
            required
        >

        <!-- Content field. JavaScript will require more than 25 characters. -->
        <label for="description">Property Description</label>
        <textarea
            id="description"
            name="description"
            placeholder="Describe the rental property in more than 25 characters"
            required
        ></textarea>

        <!-- Four domain-appropriate categories. -->
        <label for="propertyType">Property Type</label>
        <select id="propertyType" name="propertyType" required>
            <option value="" disabled selected>Select a property type</option>
            <option value="Apartment">Apartment</option>
            <option value="House">House</option>
            <option value="Studio">Studio</option>
            <option value="Shared Room">Shared Room</option>
        </select>

        <!-- Terms and conditions checkbox. -->
        <div class="terms">
            <input
                type="checkbox"
                id="termsAccepted"
                name="termsAccepted"
            >
            <label for="termsAccepted">
                I agree to the terms and conditions.
            </label>
        </div>

        <button type="submit">Submit Rental Listing</button>
    </form>

    <!-- JavaScript is linked at the end of the HTML body. -->
    <script src="feedback.js"></script>
</body>
</html>
