<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Homework requires the title to be HW1-{Your Name}. -->
    <title>HW2-Xuanhua Li</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <main class="page-container">
        <h1>Rental Housing Listings</h1>

        <section class="panel" aria-labelledby="formHeading">
            <h2 id="formHeading">Submit a Rental Listing</h2>

            <form id="rentalForm">
                <label for="listingTitle">Listing Title</label>
                <input
                    type="text"
                    id="listingTitle"
                    name="listingTitle"
                    placeholder="Enter a title for the rental listing"
                    required
                    autofocus
                >

                <label for="address">Property Address</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter the rental property address"
                    required
                >

                <label for="submitterEmail">Submitter Email</label>
                <input
                    type="email"
                    id="submitterEmail"
                    name="submitterEmail"
                    placeholder="Enter your email address"
                    required
                >

                <label for="description">Property Description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe the rental property in more than 25 characters"
                    required
                ></textarea>

                <label for="propertyType">Property Type</label>
                <select
                    id="propertyType"
                    name="propertyType"
                    required
                >
                    <option value="" disabled selected>
                        Select a property type
                    </option>
                    <option value="Apartment">Apartment</option>
                    <option value="House">House</option>
                    <option value="Studio">Studio</option>
                    <option value="Shared Room">Shared Room</option>
                </select>

                <div class="terms">
                    <input
                        type="checkbox"
                        id="termsAccepted"
                        name="termsAccepted"
                    >
                    <label for="termsAccepted">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <button type="submit">
                    Submit Rental Listing
                </button>
            </form>
        </section>

        <section class="panel" aria-labelledby="listHeading">
            <h2 id="listHeading">Available Rental Listings</h2>

            <div
                id="loadingState"
                class="status loading-state"
                role="status"
                aria-live="polite"
                hidden
            >
                Loading rental listings...
            </div>

            <div
                id="emptyState"
                class="status empty-state"
                role="status"
                hidden
            >
                No rental listings are currently available.
            </div>

            <div
                id="errorState"
                class="status error-state"
                role="alert"
                hidden
            >
                Unable to load rental listings. Please try again.
            </div>

            <ul
                id="listingList"
                class="listing-list"
                aria-live="polite"
            ></ul>
        </section>
    </main>

    <script src="feedback.js"></script>
</body>
</html>
