domain_id: 6
assigned_domain: "Rental housing listings"
question_count: 6

questions:
  - id: "q1"
    type: "one_chunk"
    answerability: "answerable"
    question: "What is the maximum security deposit a California landlord may generally charge, and what exception applies to qualifying small landlords?"
    expected_answer: "A California landlord may generally charge no more than one month's rent as a security deposit. A qualifying small landlord may charge up to two months' rent."
    expected_source_files:
      - "corpus/hw03/ca_landlord_tenant_guide_2026.pdf"
    required_terms:
      - ["one month", "1 month"]
      - ["two month", "2 month"]

  - id: "q2"
    type: "two_chunks"
    answerability: "answerable"
    question: "What is the general security deposit limit in California, and how long does a landlord have after move-out to return the deposit or provide an itemized statement?"
    expected_answer: "A landlord may generally charge no more than one month's rent as a security deposit, with a qualifying small-landlord exception allowing up to two months' rent. After the tenant moves out, the landlord generally has 21 days to return the deposit or provide an itemized statement of deductions and any remaining refund."
    expected_source_files:
      - "corpus/hw03/ca_landlord_tenant_guide_2026.pdf"
    required_terms:
      - ["one month", "1 month"]
      - ["21 days"]

  - id: "q3"
    type: "similar_across_documents"
    answerability: "answerable"
    question: "How do the two HUD documents describe assistance animals as a reasonable accommodation for a person with a disability?"
    expected_answer: "Assistance animals may be required as a reasonable accommodation for a person with a disability. A housing provider generally may not charge a pet deposit or additional rent for a necessary assistance animal, subject to health, safety, and property-damage limits."
    expected_source_files:
      - "corpus/hw04/hud_assistance_animal_notice.pdf"
      - "corpus/hw04/hud_fair_housing_guide_2025.pdf"
    required_terms:
      - ["assistance animal"]
      - ["reasonable accommodation"]
      - ["pet deposit", "extra rent", "additional rent"]

  - id: "q4"
    type: "ambiguous"
    answerability: "answerable"
    question: "Can a landlord charge extra money for a pet or an assistance animal in a rental unit?"
    expected_answer: "It depends on whether the animal is an ordinary pet or an assistance animal. A housing provider may have ordinary pet rules, but a necessary assistance animal must generally be allowed as a reasonable accommodation without a pet deposit or extra rent, subject to health, safety, and property-damage limits."
    expected_source_files:
      - "corpus/hw04/hud_assistance_animal_notice.pdf"
      - "corpus/hw04/hud_fair_housing_guide_2025.pdf"
    required_terms:
      - ["depends", "ordinary pet", "assistance animal"]
      - ["pet deposit", "extra rent", "additional rent"]

  - id: "q5"
